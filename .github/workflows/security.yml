name: Security

# Code scanning, vulnerability and secret detection. Runs on pull requests,
# on main after the merge, and weekly so new advisories are caught even
# without code changes. Findings in SARIF format appear under
# Security > Code scanning.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  # Published modules; examples and integration are not shipped.
  MODULES: ". contrib/prometheus contrib/otel contrib/fiber"

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality
      - name: Build
        run: |
          for m in $MODULES examples; do (cd "$m" && go build ./...) || exit 1; done
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-go

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Report (SARIF)
        run: govulncheck -format sarif ./... > govulncheck.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
      # Fails only on vulnerabilities reachable from our code.
      - name: Gate on reachable vulnerabilities
        run: |
          for m in $MODULES; do
            echo "== $m"; (cd "$m" && govulncheck ./...) || exit 1
          done

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # Gating is done by golangci-lint (gosec enabled) in CI; this job
      # publishes the full report to code scanning.
      - name: Scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -exclude-dir=examples -exclude-dir=integration -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # MIT project: block dependencies with strong copyleft licenses.
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
